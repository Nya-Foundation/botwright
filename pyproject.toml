[project]
name = "botwright"
version = "0.1.0"
description = "End-to-end test framework for Discord bots, built on discord.py."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord-py>=2.7.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.0",
]

[project.entry-points.pytest11]
botwright = "botwright.plugin"

[project.scripts]
botwright = "botwright.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botwright"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
