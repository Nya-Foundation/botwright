[project]
name = "botwright"
dynamic = ["version"]
description = "End-to-end test framework for Discord bots, built on discord.py."
readme = "README.md"
requires-python = ">=3.10"

license = "MIT"
license-files = ["LICENSE"]

authors = [
    {name = "Nya Foundation Team (k3scat)", email = "k3scat@github.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "discord-py>=2.7.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
]

[project.urls]
"Homepage" = "https://github.com/nya-foundation/botwright"
"Bug Tracker" = "https://github.com/nya-foundation/botwright/issues"

[project.entry-points.pytest11]
botwright = "botwright.plugin"

[project.scripts]
botwright = "botwright.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/botwright/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/botwright"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]


[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100


[tool.coverage.run]
source = ["src/botwright"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError"
]


[tool.semantic_release]
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/botwright/_version.py:__version__"]
build_command = "uv build"
commit_parser = "conventional"
commit_message = "chore(release): bump version to v{version} [skip ci]"
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

